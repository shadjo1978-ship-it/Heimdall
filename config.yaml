# Heimdall AI Configuration

ai_provider:
  # Provider type: 'openai', 'anthropic', 'google'
  type: 'openai'
  
  # API Configuration
  api_key: 'your-api-key-here'  # Set via environment variable HEIMDALL_API_KEY for security
  model: 'gpt-4'
  
  # Optional settings
  temperature: 0.7
  max_tokens: 2000

# Voice settings
voice:
  enabled: true
  language: 'en-US'

# Firewall settings
firewall:
  enabled: true
  content_filter: true
  blocked_keywords: []
